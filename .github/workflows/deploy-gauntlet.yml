name: Deploy Dugout Gauntlet to Pages

on:
  push:
    branches: [dugout-gauntlet]
    paths: ['gauntlet/**', '.github/workflows/deploy-gauntlet.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: gauntlet
        run: npm ci
      - name: Build (with Pages base path)
        working-directory: gauntlet
        env:
          DEPLOY_BASE: /dugout-draft/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gauntlet/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
