<svg viewBox="0 0 400 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gold gradient for "DRAFT" -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd968"/>
      <stop offset="50%" stop-color="#f0b429"/>
      <stop offset="100%" stop-color="#c99a1d"/>
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Icon: Diamond with DD -->
  <g transform="translate(10, 10)">
    <!-- Diamond outline -->
    <path d="M50 5 L95 50 L50 95 L5 50 Z" fill="none" stroke="#1e5fbb" stroke-width="3" opacity="0.7"/>
    <!-- Inner diamond fill -->
    <path d="M50 20 L80 50 L50 80 L20 50 Z" fill="#1e5fbb" fill-opacity="0.15"/>
    <!-- DD text -->
    <text x="50" y="58" font-family="Russo One, sans-serif" font-size="28" text-anchor="middle" font-weight="bold">
      <tspan fill="#ffffff">D</tspan><tspan fill="#e8682a">D</tspan>
    </text>
  </g>
  
  <!-- Wordmark -->
  <text x="130" y="52" font-family="Russo One, sans-serif" font-size="48" fill="#ffffff" letter-spacing="2">DUGOUT</text>
  <text x="130" y="102" font-family="Russo One, sans-serif" font-size="48" fill="url(#goldGradient)" letter-spacing="2">DRAFT</text>
</svg>
