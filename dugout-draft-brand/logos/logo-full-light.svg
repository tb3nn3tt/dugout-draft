<svg viewBox="0 0 400 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Darker gold gradient for light backgrounds -->
    <linearGradient id="goldGradientLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c99a1d"/>
      <stop offset="50%" stop-color="#a67c15"/>
      <stop offset="100%" stop-color="#8a6610"/>
    </linearGradient>
  </defs>
  
  <!-- Icon: Diamond with DD -->
  <g transform="translate(10, 10)">
    <!-- Diamond outline -->
    <path d="M50 5 L95 50 L50 95 L5 50 Z" fill="none" stroke="#1e5fbb" stroke-width="3"/>
    <!-- Inner diamond fill -->
    <path d="M50 20 L80 50 L50 80 L20 50 Z" fill="#1e5fbb" fill-opacity="0.1"/>
    <!-- DD text -->
    <text x="50" y="58" font-family="Russo One, sans-serif" font-size="28" text-anchor="middle" font-weight="bold">
      <tspan fill="#0a1628">D</tspan><tspan fill="#c75a1c">D</tspan>
    </text>
  </g>
  
  <!-- Wordmark -->
  <text x="130" y="52" font-family="Russo One, sans-serif" font-size="48" fill="#0a1628" letter-spacing="2">DUGOUT</text>
  <text x="130" y="102" font-family="Russo One, sans-serif" font-size="48" fill="url(#goldGradientLight)" letter-spacing="2">DRAFT</text>
</svg>
